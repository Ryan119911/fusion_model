/**:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    # Match the CB3 controller state stream measured in the real repository.
    state_publish_rate: 125.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    open_loop_control: false
